name: Governance Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O A7 compara contra a base do PR. Sem histórico completo e sem a ref da base, o
          # `git diff origin/main...HEAD` falha com `bad revision` e o gate não mede nada.
          fetch-depth: 0
      - name: Preparar ref da base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inventário
        run: python3 scripts/inventariar_acervo.py . --markdown /tmp/inventario.md --json /tmp/inventario.json
      - name: Declaração de conferência (A2)
        run: python3 scripts/check_declaracao_conferencia.py .
      - name: Escopo do diff (A7)
        # Em push nao existe github.base_ref: o gate recebia "origin/" e derrubava o job. Push na main
        # nao e diff de frente — o A7 so julga PR. (Perdi esta linha ao reescrever o arquivo no #120.)
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/check_escopo_do_diff.py --base "origin/${{ github.base_ref }}" \
            --permitir docs/ --permitir scripts/ --permitir tests/ --permitir ops/ \
            --permitir configs/ --permitir .github/ --permitir AGENTS.md --permitir AGENTS_LOCAL.md \
            --permitir governanca/
      - name: Escopo da frente, lido do registro vivo (A9)
        # A7 acima usa a lista digitada no workflow — que e mais larga que a gaveta e deixou uma PR do
        # bambu levar 25 arquivos do cobre. Este passo nao tem lista: le o write_scope da frente em
        # governanca/frentes/<FRENTE>.json, copia derivada de r4-claims@<sha> com hash por arquivo no
        # MANIFESTO.json. O repositorio de governanca e privado e este e publico, entao o CI nao alcanca
        # o ref: a copia e conferida pelo manifesto antes de medir, e divergencia e NAO_MEDIDO.
        # PR que nao declara FRENTE=<nome> no corpo nao e medida: sai NAO_MEDIDO, nunca PASS.
        if: github.event_name == 'pull_request'
        env:
          CORPO: ${{ github.event.pull_request.body }}
        run: |
          FRENTE=$(printf '%s' "$CORPO" | grep -oiE 'FRENTE=[A-Z0-9_-]+' | head -1 | cut -d= -f2)
          if [ -z "$FRENTE" ]; then
            echo "::error::A PR nao declara FRENTE=<nome> no corpo. Sem frente declarada o escopo nao e medido (A9). A lista do A7 acima e do repositorio, nao da gaveta."
            exit 2
          fi
          echo "FRENTE=$FRENTE"
          python3 scripts/check_escopo_do_diff.py --base "origin/${{ github.base_ref }}" \
            --frente "$FRENTE" --registro governanca/frentes
      - name: Gerador do pacote de auditoria (testes)
        # Instrumento testado so na funcao nao conta. Este passo roda os testes do gerador, inclusive
        # o que o executa contra as frentes reais quando o repo do acervo esta presente.
        run: python3 tests/test_gerar_pacote_auditoria.py
      - name: Front matter
        run: python3 scripts/validate_frontmatter.py
      - name: Build estrito
        run: mkdocs build --strict
      - name: Sem PDFs rastreados
        run: |
          if git ls-files | grep -Ei '\.pdf$'; then
            echo "::error::PDF rastreado detectado"
            exit 1
          fi
      - name: Sem segredos óbvios
        run: |
          if grep -rniE '(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36,}|AKIA[0-9A-Z]{16})' --include='*.py' --include='*.yml' --include='*.yaml' --include='*.md' . ; then
            echo "::error::Possível segredo no working tree"
            exit 1
          fi
