name: Governance Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O A7 compara contra a base do PR. Sem histórico completo e sem a ref da base, o
          # `git diff origin/main...HEAD` falha com `bad revision` e o gate não mede nada.
          fetch-depth: 0
      - name: Preparar ref da base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inventário
        run: python3 scripts/inventariar_acervo.py . --markdown /tmp/inventario.md --json /tmp/inventario.json
      - name: Declaração de conferência (A2)
        run: python3 scripts/check_declaracao_conferencia.py .
      - name: Escopo do diff (A7)
        run: |
          python3 scripts/check_escopo_do_diff.py --base "origin/${{ github.base_ref }}" \
            --permitir docs/ --permitir scripts/ --permitir tests/ --permitir ops/
      - name: Front matter
        run: python3 scripts/validate_frontmatter.py
      - name: Build estrito
        run: mkdocs build --strict
      - name: Sem PDFs rastreados
        run: |
          if git ls-files | grep -Ei '\.pdf$'; then
            echo "::error::PDF rastreado detectado"
            exit 1
          fi
      - name: Sem segredos óbvios
        run: |
          if grep -rniE '(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36,}|AKIA[0-9A-Z]{16})' --include='*.py' --include='*.yml' --include='*.yaml' --include='*.md' . ; then
            echo "::error::Possível segredo no working tree"
            exit 1
          fi
